$kind: http-example
request:
  url: "{{baseUrl}}/api/tags/:tagId"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    tagId: "1624"
  body:
    type: json
    content: |-
      {
        "id": 5201,
        "label": "string",
        "ownerId": 7448
      }
