$kind: http-example
request:
  url: "{{baseUrl}}/api/Saving_Goal/AddGoal/:goalDTo"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: text/plain
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    goalDTo: string
  body:
    type: json
    content: |-
      {
        "currentAmount": 7.206777727339053e+307,
        "deadlineDate": "1970-02-15",
        "targetAmount": 7.458220144147451e+307,
        "title": "string",
        "userId": 2249
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "title": "string",
        "status": 3829,
        "detail": "string",
        "instance": "string"
      }
order: 2000
