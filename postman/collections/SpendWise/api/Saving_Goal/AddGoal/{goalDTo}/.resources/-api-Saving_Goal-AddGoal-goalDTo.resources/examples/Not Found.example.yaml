$kind: http-example
request:
  url: "{{baseUrl}}/api/Saving_Goal/AddGoal/:goalDTo"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: text/plain
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    goalDTo: string
  body:
    type: json
    content: |-
      {
        "currentAmount": 1.2879537016518947e+308,
        "deadlineDate": "1964-02-27",
        "targetAmount": 1.74991792645672e+308,
        "title": "string",
        "userId": 8501
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "title": "string",
        "status": 8859,
        "detail": "string",
        "instance": "string"
      }
order: 2000
