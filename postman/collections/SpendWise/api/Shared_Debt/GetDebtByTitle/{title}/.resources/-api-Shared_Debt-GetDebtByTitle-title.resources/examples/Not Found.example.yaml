$kind: http-example
request:
  url: "{{baseUrl}}/api/Shared_Debt/GetDebtByTitle/:title"
  method: GET
  headers:
    - key: Accept
      value: text/plain
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    title: string
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "title": "string",
        "status": 8859,
        "detail": "string",
        "instance": "string"
      }
order: 3000
