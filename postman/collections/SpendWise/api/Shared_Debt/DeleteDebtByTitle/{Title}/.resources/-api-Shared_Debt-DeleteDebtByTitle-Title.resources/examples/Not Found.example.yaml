  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "title": "string",
        "status": 651,
        "detail": "string",
        "instance": "string",
        "key_0": "string"
      }
order: 2000
