$kind: http-example
request:
  url: "{{baseUrl}}/api/Shared_Debt/DeleteDebtByTitle/:Title"
  method: DELETE
  headers:
    - key: Accept
      value: text/plain
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    Title: string
