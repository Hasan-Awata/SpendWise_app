$kind: http-example
request:
  url: "{{baseUrl}}/api/wallets"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "currencyId": 1487674339,
        "isSaved": false,
        "userId": 8204,
        "walletId": 523,
        "balance": 7.159384727974483e+307
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
