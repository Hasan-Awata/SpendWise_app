$kind: http-example
request:
  url: "{{baseUrl}}/api/wallets/:walletId"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    walletId: "1624"
  body:
    type: json
    content: |-
      {
        "currency": {
          "currencyName": "string",
          "currencyId": 8268,
          "liveValue": 6629.581871169296
        },
        "isSaved": false,
        "userId": 8195,
        "walletId": 5098,
        "balance": 1.3328949679274792e+308
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
